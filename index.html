<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cero Deuda | Landing móvil</title>
  <meta name="description" content="Landing móvil de alta conversión de Cero Deuda con 12 imágenes en orden descendente." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      background: #efeff3;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
    }
    .mobile-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 22px 60px rgba(0,0,0,.12);
    }
    .top-cta {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 10px 12px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex;
      justify-content: center;
    }
    .top-counter {
      width: 100%;
      border-radius: 18px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg,#6717ff 0%,#7b00ff 42%,#35b6ff 100%);
      box-shadow: 0 12px 28px rgba(103,23,255,.28);
      padding: 10px 12px;
      text-align: center;
    }
    .top-counter-label {
      display: block;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .top-counter-time {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .top-counter-box {
      min-width: 64px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 8px 6px;
    }
    .top-counter-box strong {
      display: block;
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
    }
    .top-counter-box span {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .92;
    }
    .bottom-cta a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg,#6717ff 0%,#7b00ff 42%,#35b6ff 100%);
      min-height: 58px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: .01em;
      box-shadow: 0 12px 28px rgba(103,23,255,.28);
      text-transform: uppercase;
    }
    .icon-wa {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      fill: #fff;
    }
    .slides { width: 100%; }
    .slide {
      width: 100%;
      line-height: 0;
      position: relative;
    }
    .slide img {
      width: 100%;
      height: auto;
      display: block;
    }
    .img-overlay {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 2.2%;
      height: 9.5%;
      border-radius: 999px;
      z-index: 5;
      background: linear-gradient(135deg, rgba(103,23,255,.08), rgba(53,182,255,.05));
      box-shadow: 0 0 0 0 rgba(103,23,255,.30);
      animation: pulse 1.9s infinite;
    }
    .img-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.22);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(103,23,255,.28); filter: brightness(1); }
      70% { box-shadow: 0 0 0 16px rgba(103,23,255,0); filter: brightness(1.06); }
      100% { box-shadow: 0 0 0 0 rgba(103,23,255,0); filter: brightness(1); }
    }
  </style>
</head>
<body>
  <main class="mobile-shell" aria-label="Landing móvil Cero Deuda 12 imágenes">
    <div class="top-cta">
      <div class="top-counter" aria-label="Oferta especial por el mes de julio">
        <span class="top-counter-label">Oferta especial por el mes de julio</span>
        <div class="top-counter-time">
          <div class="top-counter-box"><strong id="july-days">00</strong><span>Días</span></div>
          <div class="top-counter-box"><strong id="july-hours">00</strong><span>Horas</span></div>
          <div class="top-counter-box"><strong id="july-minutes">00</strong><span>Min</span></div>
          <div class="top-counter-box"><strong id="july-seconds">00</strong><span>Seg</span></div>
        </div>
      </div>
    </div>

    <section class="slides">
      <div class="slide"><img src="assets/12.jpg" alt="Imagen 12" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20analizar%20mi%20caso%20por%20WhatsApp" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 12"></a></div>
      <div class="slide"><img src="assets/11.jpg" alt="Imagen 11" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20hablar%20con%20un%20asesor" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 11"></a></div>
      <div class="slide"><img src="assets/10.jpg" alt="Imagen 10" /></div>
      <div class="slide"><img src="assets/09.jpg" alt="Imagen 09" /></div>
      <div class="slide"><img src="assets/08.jpg" alt="Imagen 08" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20comenzar%20mi%20an%C3%A1lisis%20con%20Cero%20Deuda" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 08"></a></div>
      <div class="slide"><img src="assets/07.jpg" alt="Imagen 07" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20recuperar%20mis%20oportunidades" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 07"></a></div>
      <div class="slide"><img src="assets/06.jpg" alt="Imagen 06" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20conocer%20mi%20caso%20sin%20compromiso" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 06"></a></div>
      <div class="slide"><img src="assets/05.jpg" alt="Imagen 05" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20dar%20el%20primer%20paso%20con%20Cero%20Deuda" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 05"></a></div>
      <div class="slide"><img src="assets/04.jpg" alt="Imagen 04" /></div>
      <div class="slide"><img src="assets/03.jpg" alt="Imagen 03" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20aprovechar%20los%20bonos%20de%20Cero%20Deuda" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 03"></a></div>
      <div class="slide"><img src="assets/02.jpg" alt="Imagen 02" /></div>
      <div class="slide"><img src="assets/01.jpg" alt="Imagen 01" /><a class="img-overlay" href="https://wa.me/573145777777?text=Hola%2C%20quiero%20resolver%20mis%20dudas%20con%20Cero%20Deuda" target="_blank" rel="noopener noreferrer" aria-label="CTA imagen 01"></a></div>
    </section>
  </main>

  <script>
    function updateJulyCounter() {
      const now = new Date();
      const julyEnd = new Date(now.getFullYear(), 7, 1, 0, 0, 0, 0);
      let diff = julyEnd - now;
      if (diff < 0) diff = 0;
      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      document.getElementById('july-days').textContent = String(days).padStart(2, '0');
      document.getElementById('july-hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('july-minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('july-seconds').textContent = String(seconds).padStart(2, '0');
    }
    updateJulyCounter();
    setInterval(updateJulyCounter, 1000);
  </script>
</body>
</html>
